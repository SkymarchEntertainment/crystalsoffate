<body>
<canvas id="app"></canvas>

<div id="hud" class="layer hidden">
	<div id="foeHand"></div>
	<button id="gear"><img src="assets/ui/battle_gear.webp" alt="Settings"></button>
	<div id="side" class="single nofill">
		<i id="ring"></i><i id="fill"></i>
		<div id="round">Turn 1</div>
		<div id="timer">:00</div>
		<div id="single">Starting</div>
		<button id="end" class="btn devonly">Ready</button>
	</div>
	<div id="foeCard" class="hidden"><img alt=""></div>
	<div id="deckFoe" class="deckinfo"></div><div id="deckMe" class="deckinfo"></div>
	<div id="lblFoe" class="avlabel"></div><div id="lblMe" class="avlabel"></div>
	<div id="emoteMe" class="emote"></div><div id="emoteFoe" class="emote"></div>
	<div id="banner"></div>
	<button id="emoteBtn" class="hidden" title="Emotes"><img src="assets/ui/sprites/Battle/EmoteButton.webp" alt="Emotes"></button>
	<div id="emoteList" class="hidden"><div id="emoteScroll"></div><button id="emoteClose" title="Close"></button></div>
	<div id="tooltip" class="hidden"></div>
	<div id="options" class="hidden">
		<div id="optFrame"><div id="optIn">
			<h3>SETTINGS</h3><button id="optClose">X</button>
			<div class="m-options">
				<label>Music</label><input type="range" min="0" max="1" step="0.05" id="optMusic">
				<label>Effects</label><input type="range" min="0" max="1" step="0.05" id="optSfx">
				<label>Background</label><input type="range" min="0" max="1" step="0.05" id="optAmbient">
				<label class="m-check"><input type="checkbox" id="optEmotes"> Hide enemy emotes</label>
			</div>
			<button id="quit" class="m-flat">Exit</button><button id="optOk" class="m-flat">OK</button>
		</div></div>
	</div>
	<div id="quitConfirm" class="hidden"><div><p>Concede and leave battle?</p><button id="quitNo" class="m-flat">No</button><button id="quitYes" class="m-flat">Yes</button></div></div>
	<div id="toast"></div>
</div>
<div id="waiting" class="layer hidden"><span>Waiting for Opponent...</span></div>


<div id="menu" class="overlay hidden"></div>

<div id="mulligan" class="overlay dim hidden">
	<h1>Starting hand</h1>
	<div id="mulliganTime"></div>
	<h2 id="mulliganHint">Tap on the cards you want to replace</h2>
	<div class="pick" id="mulliganCards"></div>
	<button id="mulliganOk" class="btn">Confirm</button>
</div>

<div id="result" class="hidden">
	<div id="resOutcome"><img id="resFrame" alt=""><img id="resTitle" alt=""></div>
	<div id="resWinner" class="hidden"><img src="assets/ui/sprites/Victory/winner_with_bg.webp" alt="Winner"><b id="resName"></b></div>
	<p id="resTap" class="hidden">Tap to Continue</p>
</div>

<button id="mute" class="hidden"></button>
<button id="skip" class="btn hidden" style="position:fixed;right:24px;bottom:56px">Skip</button>

<div id="login" class="hidden"></div>

<div id="boot" class="overlay"><h1>Crystals of Fate</h1><div id="loading">Loading…</div></div>

<script src="config.js"></script>
</body>
</html>
